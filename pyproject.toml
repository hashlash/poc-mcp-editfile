[project]
name = "mcp-edit-poc"
version = "0.1.0"
description = "POC: MCP-driven edits that render as native diffs in coding agents"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
]

[project.scripts]
mcp-edit-poc = "mcp_edit_poc.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_edit_poc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"